[project]
name = "windagent_verification"
version = "0.3.0"
description = "Quality gates, verification runners, test assertion helpers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "windagent-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["windagent_verification"]