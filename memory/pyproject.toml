[project]
name = "windagent_memory"
version = "0.3.0"
description = "Multi-layered memory, working memory, long-term memory, semantic store"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "windagent-core",
    "windagent-storage",
]

[tool.uv.sources]
windagent-core = { workspace = true }
windagent-storage = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["windagent_memory"]
