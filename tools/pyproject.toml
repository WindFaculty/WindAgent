[project]
name = "windagent_tools"
version = "0.3.0"
description = "Tool registry, filesystem, shell, git, code_search, AST, LSP, browser, database, MCP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "windagent-core",
]

[tool.uv.sources]
windagent-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["windagent_tools"]
