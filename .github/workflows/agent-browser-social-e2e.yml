name: Agent Browser Social E2E

on:
  pull_request:
    paths:
      - "tools/windagent_tools/browser/**"
      - "workflows/windagent_workflows/social_research.py"
      - "apps/cli/windagent_cli/social_report*.py"
      - "tests/integration/test_agent_browser_social_e2e.py"
      - ".github/workflows/agent-browser-social-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-to-report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AGENT_BROWSER_BIN: agent-browser
      RUN_AGENT_BROWSER_E2E: "1"
      WINDAGENT_E2E_EVIDENCE_DIR: artifacts/agent-browser-e2e

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install WindAgent workspace
        run: uv sync --all-packages --group dev

      - name: Install pinned agent-browser and Chrome
        run: |
          npm install --global agent-browser@0.33.1
          agent-browser install --with-deps
          agent-browser doctor --offline --quick

      - name: Run browser adapter and workflow tests
        run: |
          uv run pytest -q \
            tests/unit/tools/test_agent_browser_tool.py \
            tests/unit/workflows/test_social_research.py \
            tests/unit/apps/test_social_report_gateway.py \
            tests/integration/test_agent_browser_social_e2e.py

      - name: Upload E2E report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-browser-social-e2e
          path: artifacts/agent-browser-e2e/
          if-no-files-found: error
