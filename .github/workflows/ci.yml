name: CI

# Phase 1 rule: CI exists from day one — lint, typecheck, unit,
# architecture, security, build.  No phase waits for "migration done".

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-caching: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Typecheck (mypy)
        run: uv run mypy

      - name: Unit tests
        run: uv run pytest tests/unit -v

      - name: Architecture gates
        run: uv run pytest tests/architecture -v -m architecture

      - name: Contract tests (API + Alembic, offline)
        run: uv run pytest tests/contract -v

      - name: Parity and foundation E2E tests
        run: uv run pytest tests/parity tests/e2e -v

      - name: Security audit (python)
        run: uv run --with pip-audit pip-audit

  postgres-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: windagent_v2
          POSTGRES_USER: windagent
          POSTGRES_PASSWORD: windagent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U windagent -d windagent_v2"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      WINDAGENT_DATABASE_URL: postgresql+asyncpg://windagent:windagent@localhost:5432/windagent_v2
      WINDAGENT_ENVIRONMENT: development
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-caching: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Integration tests (PostgreSQL)
        run: uv run pytest tests/integration -m postgres -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci
        working-directory: frontend

      - name: Typecheck
        run: npm run typecheck --workspaces --if-present
        working-directory: frontend

      - name: Tests
        run: npm test --workspaces --if-present
        working-directory: frontend

      - name: Build
        run: npm run build --workspace app
        working-directory: frontend

      - name: Security audit (npm)
        run: npm audit --audit-level=high
        working-directory: frontend
