      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Sync dependencies
        run: uv sync --all-packages
      # The phase-0 baseline producer records the local ffmpeg version in its
      # environment evidence; a missing binary must degrade to "missing",
      # but on runners where it IS installable we prefer the real probe.
      - name: Install ffmpeg (optional toolchain probe)
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "ffmpeg already present: $(ffmpeg -version | head -1)"
          elif command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          else
            echo "no package manager available; producer will record ffmpeg as missing"
          fi
      - name: Verification tests
        run: |
          python scripts/verification/run_command_receipt.py \
            --name verification \
            --output artifacts/ci/verification-tier/receipts/pytest.json \
            --timeout 600 \
