name: CI & Orchestration V2 Cutover Acceptance

on:
  push:
    branches: [main, feat/*, fix/*]
  pull_request:
    branches: [main]

jobs:
  test_matrix:
    name: Backend & Orchestration Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.0"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync dependencies
        run: uv sync --all-packages

      - name: Ruff Lint & Format Check
        run: |
          uv run ruff check orchestration storage execution apps/backend tests
          uv run ruff format --check orchestration storage execution apps/backend tests

      - name: Architecture Boundary & No-Legacy Check
        run: |
          uv run python scripts/check_no_legacy_orchestration.py
          uv run python scripts/check_architecture_imports.py

      - name: Root & Subsystem Unit Tests
        run: uv run pytest tests/unit/ -v --tb=short

      - name: Regression & Defect Tests
        run: uv run pytest tests/regression/ -v --tb=short

      - name: Backend & HTTP Integration Tests
        run: uv run pytest tests/integration/ -v --tb=short

      - name: Empirical Performance Benchmark Validation
        run: uv run python scripts/bench_orchestration_v2.py

  frontend_matrix:
    name: Frontend Typecheck & Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Frontend unit tests
        working-directory: apps/desktop
        run: npm test -- --run

      - name: Frontend typecheck
        working-directory: apps/desktop
        run: npx tsc --noEmit

      - name: Frontend build
        working-directory: apps/desktop
        run: npm run build
