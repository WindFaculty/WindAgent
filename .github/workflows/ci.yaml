name: CI & Orchestration V2 Cutover Acceptance

on:
  push:
    branches: [main, feat/*, fix/*]
  pull_request:
    branches: [main]

jobs:
  test_matrix:
    name: V2 Canonical Architecture Test (${{ matrix.os }}, ${{ matrix.database }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        database: [sqlite, postgresql]
        include:
          - os: ubuntu-latest
            database: postgresql
            services:
              postgres:
                image: postgres:16-alpine
                env:
                  POSTGRES_DB: windagent
                  POSTGRES_USER: test
                  POSTGRES_PASSWORD: test
                ports:
                  - 5432:5432
                options: >-
                  --health-cmd "pg_isready -U test -d windagent"
                  --health-interval 10s
                  --health-timeout 5s
                  --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.0"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync dependencies
        run: uv sync --all-packages

      - name: Set database URL
        run: |
          if [ "${{ matrix.database }}" = "postgresql" ]; then
            echo "WINDAGENT_DATABASE_URL=postgresql+asyncpg://test:test@localhost:5432/windagent" >> $GITHUB_ENV
          else
            echo "WINDAGENT_DATABASE_URL=sqlite+aiosqlite:///windagent.db" >> $GITHUB_ENV
          fi

      - name: Ruff Lint & Format Check
        run: |
          uv run ruff check orchestration storage execution tests
          uv run ruff format --check orchestration storage execution tests

      - name: Architecture Boundary & No-Legacy Check
        run: |
          uv run python scripts/check_no_legacy_orchestration.py
          uv run python scripts/check_architecture_imports.py

      - name: Root & Subsystem Unit Tests
        run: uv run pytest tests/unit/ -v --tb=short

      - name: Regression & Defect Tests
        run: uv run pytest tests/regression/ -v --tb=short

      - name: Backend & HTTP Integration Tests
        run: uv run pytest tests/integration/ -v --tb=short

      - name: Multi-replica fencing tests
        if: matrix.database == 'postgresql'
        run: |
          uv run pytest tests/integration/ -k "fencing or replica or leader" -v --tb=short
          uv run pytest tests/unit/worker/ -k "fencing or replica or lease" -v --tb=short

      - name: Empirical Performance Benchmark Validation
        run: uv run python scripts/bench_orchestration_v2.py

  frontend_matrix:
      name: Frontend Typecheck & Build (${{ matrix.os }}, ${{ matrix.app }})
      runs-on: ${{ matrix.os }}
      strategy:
        matrix:
          os: [ubuntu-latest, windows-latest]
          app: [desktop, web]
      steps:
        - uses: actions/checkout@v4

        - name: Set up Node.js
          uses: actions/setup-node@v4
          with:
            node-version: "20"

        - name: Install ${{ matrix.app }} dependencies
          working-directory: apps/${{ matrix.app }}
          run: npm ci

        - name: Frontend unit tests
          working-directory: apps/${{ matrix.app }}
          run: npm test -- --run

        - name: Frontend typecheck
          working-directory: apps/${{ matrix.app }}
          run: npx tsc --noEmit

        - name: Frontend build
          working-directory: apps/${{ matrix.app }}
          run: npm run build

        - name: Frontend coverage
          if: matrix.app == 'web'
          working-directory: apps/web
          run: npm run test:coverage -- --run