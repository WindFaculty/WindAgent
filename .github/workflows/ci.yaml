          python scripts/verification/run_command_receipt.py \
            --name desktop_npm_ci \
            --cwd apps/desktop \
            --output artifacts/ci/desktop-test/receipts/npm_ci.json \
            --timeout 600 \
            -- npm ci

      - name: Typecheck
        run: |
          python scripts/verification/run_command_receipt.py \
            --name desktop_typecheck \
            --cwd apps/desktop \
            --output artifacts/ci/desktop-test/receipts/typecheck.json \
            --timeout 300 \
            -- npx tsc --noEmit

      - name: Unit tests
        run: |
          python scripts/verification/run_command_receipt.py \
            --name desktop_tests \
            --cwd apps/desktop \
