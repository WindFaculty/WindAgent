name: CI & Phase 7 Verification Matrix

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "hardening/**"
      - "refactor/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  UV_VERSION: "0.5.0"
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

defaults:
  run:
    shell: bash

jobs:
  artifact-protocol:
    name: Artifact Protocol Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Sync dependencies
        run: uv sync --all-packages

      - name: Generate immutable candidate evidence
        run: |
          uv run python scripts/verification/generate_phase7_evidence.py \
            --commands-file scripts/verification/command_registry.yaml \
            --output-dir artifacts/architecture_v2_production_hardening/phase_07 \
            --cwd . \
            --run-id "ci-${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Validate candidate evidence
        run: |
          RUN_DIR="artifacts/architecture_v2_production_hardening/phase_07/runs/ci-${{ github.run_id }}-${{ github.run_attempt }}"
          BUNDLE="$RUN_DIR/evidence_bundle.json"
          uv run python scripts/verification/validate_evidence_bundle.py "$BUNDLE"
          uv run python scripts/validate_artifact_schema.py "$BUNDLE" \
            --verify-hashes \
            --fail-on-warning \
            --repo-root . \
            --candidate-sha "${{ github.sha }}"
          # Validate the CURRENT run's artifacts recursively. The committed
          # final/ directory attests a DIFFERENT branch's publication commit
          # (evidence identity is per-branch; this gate must not block the
          # candidate on another lineage's stale pointer).
          uv run python scripts/validate_artifact_schema.py \
            --directory "$RUN_DIR" \
            --recursive \
            --verify-hashes \
            --fail-on-warning \
            --repo-root . \
            --candidate-sha "${{ github.sha }}"

      - name: Verify negative fixtures fail
        run: |
          for fixture in tests/fixtures/artifacts/*.json; do
            if [ "$(basename "$fixture")" != "valid_artifact.json" ]; then
              if uv run python scripts/validate_artifact_schema.py "$fixture"; then
                echo "Negative fixture unexpectedly passed: $fixture"
                exit 1
              fi
            fi
          done

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Record Phase 6 negative-injection receipts
        run: |
          python scripts/verification/run_negative_injections.py \
            --root . \
            --output-dir artifacts/ci/artifact-protocol/negative-injections

      - name: Upload artifact protocol evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artifact-protocol-evidence
          if-no-files-found: warn
          path: |
            artifacts/architecture_v2_production_hardening/phase_07/runs/ci-${{ github.run_id }}-${{ github.run_attempt }}
            artifacts/architecture_v2_production_hardening/phase_07/quarantine/ci-${{ github.run_id }}-${{ github.run_attempt }}
            artifacts/architecture_v2_production_hardening/phase_07/latest.json
            artifacts/ci/artifact-protocol/negative-injections/

  version-consistency:
    name: Version Consistency Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Sync dependencies
        run: uv sync --all-packages

      - name: Run fail-closed version check
        run: |
          python scripts/verification/run_command_receipt.py \
            --name version_consistency \
            --output artifacts/ci/version-consistency/receipts/version_consistency.json \
            --timeout 120 \
            -- uv run python scripts/check_version_consistency.py \
              --root . \
              --report artifacts/ci/version-consistency/version_consistency_report.json

      - name: Capture environment
        if: always()
        run: |
          python scripts/verification/capture_environment.py \
            --cwd . \
            --output artifacts/ci/version-consistency/environment.json

      - name: Upload version evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: version-consistency-evidence
          path: artifacts/ci/version-consistency/

  architecture-boundaries:
    name: Architecture Boundaries Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Sync dependencies
        run: uv sync --all-packages

      - name: Architecture checks
        run: |
          python scripts/verification/run_command_receipt.py \
            --name architecture_boundaries \
            --output artifacts/ci/architecture-boundaries/receipts/architecture_boundaries.json \
            --timeout 180 \
            -- uv run python scripts/check_architecture_imports.py \
              --root . \
              --json \
              --report artifacts/ci/architecture-boundaries/dependency_boundary_report.json \
              --graph artifacts/ci/architecture-boundaries/import_graph.json

      - name: No-legacy check
        if: always()
        run: |
          python scripts/verification/run_command_receipt.py \
            --name no_legacy_orchestration \
            --output artifacts/ci/architecture-boundaries/receipts/no_legacy_orchestration.json \
            --timeout 120 \
            -- uv run python scripts/check_no_legacy_orchestration.py

      - name: Repair-scope Ruff check
        if: always()
        run: |
          python scripts/verification/run_command_receipt.py \
            --name ruff_check \
            --output artifacts/ci/architecture-boundaries/receipts/ruff_check.json \
            --timeout 180 \
            -- uv run ruff check .

      - name: Capture environment
        if: always()
        run: |
          python scripts/verification/capture_environment.py \
            --cwd . \
            --output artifacts/ci/architecture-boundaries/environment.json

      - name: Upload architecture evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: architecture-boundaries-evidence
          path: artifacts/ci/architecture-boundaries/

  integration-sqlite:
    name: Integration (SQLite)
    runs-on: ubuntu-latest
    env:
      WINDAGENT_DATABASE_URL: sqlite+aiosqlite:///windagent.db
    steps:
      - uses: actions/checkout@v4
      # ADR 0006 §5: writable temp dir for tests. Job-level `env:` cannot use
      # the runner context (it makes the whole workflow file invalid), so the
      # temp vars are published from the first step via $GITHUB_ENV instead.
      - name: Configure writable temp dir
        run: |
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Sync dependencies
        run: uv sync --all-packages
      - name: Integration tests (excluding postgres)
        run: |
          python scripts/verification/run_command_receipt.py \
            --name integration_sqlite \
            --output artifacts/ci/integration-sqlite/receipts/pytest.json \
            --timeout 600 \
            -- uv run pytest tests/integration -q -m "not postgres" \
              --junitxml=artifacts/ci/integration-sqlite/test-results/pytest.xml
      - name: Capture environment
        if: always()
        run: |
          python scripts/verification/capture_environment.py \
            --cwd . \
            --output artifacts/ci/integration-sqlite/environment.json
      - name: Upload integration evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-sqlite-evidence
          path: artifacts/ci/integration-sqlite/

  coverage-gate:
    name: Coverage Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Sync dependencies
        run: uv sync --all-packages
      - name: Measure coverage baseline
        run: |
          python scripts/verification/run_command_receipt.py \
            --name coverage \
            --output artifacts/ci/coverage-gate/receipts/coverage.json \
            --timeout 600 \
            -- uv run pytest tests/unit -q --cov=windagent_core --cov-report=json:artifacts/ci/coverage-gate/coverage.json --cov-report=xml:artifacts/ci/coverage-gate/coverage.xml --cov-report=term
      - name: Enforce ratchet
        run: |
          uv run python scripts/verification/check_coverage_ratchet.py --baseline artifacts/test-refactor/t7/coverage/baseline.json --current artifacts/ci/coverage-gate/coverage.json
      - name: Capture environment
        if: always()
        run: |
          python scripts/verification/capture_environment.py \
            --cwd . \
            --output artifacts/ci/coverage-gate/environment.json
      - name: Upload coverage evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-gate-evidence
          path: artifacts/ci/coverage-gate/

  runtime-smoke:
    name: Runtime Smoke Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Sync dependencies
        run: uv sync --all-packages

      - name: Runtime imports and version smoke
        run: |
          python scripts/verification/run_command_receipt.py \
            --name runtime_version_smoke \
            --output artifacts/ci/runtime-smoke/receipts/runtime_version_smoke.json \
            --timeout 180 \
            -- uv run python scripts/verification/runtime_version_smoke.py \
              --output artifacts/ci/runtime-smoke/runtime_version_report.json

      - name: Capture environment
        if: always()
        run: |
          python scripts/verification/capture_environment.py \
            --cwd . \
            --output artifacts/ci/runtime-smoke/environment.json

      - name: Upload runtime evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-smoke-evidence
          path: artifacts/ci/runtime-smoke/

  cli-contract:
    name: CLI Contract Gate
    runs-on: ubuntu-latest
    env:
      WINDAGENT_DATABASE_URL: sqlite+aiosqlite:///windagent.db
    steps:
      - uses: actions/checkout@v4

      # ADR 0006 §5: writable temp dir for tests (job-level `env:` cannot use
      # the runner context; publish from the first step instead).
      - name: Configure writable temp dir
        run: |
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Sync dependencies
        run: uv sync --all-packages

      - name: CLI live/offline/demo/failure contract tests
        run: |
          python scripts/verification/run_command_receipt.py \
            --name cli_contract \
            --output artifacts/ci/cli-contract/receipts/pytest.json \
            --timeout 600 \
            -- uv run pytest \
              tests/component/cli/test_live_integration.py \
              tests/unit/cli/test_cli_commands.py \
              tests/unit/cli/test_phase26_convergence.py \
              -v --tb=short \
              --junitxml=artifacts/ci/cli-contract/test-results/pytest.xml

      - name: Capture environment
        if: always()
        run: |
          python scripts/verification/capture_environment.py \
            --cwd . \
            --output artifacts/ci/cli-contract/environment.json

      - name: Upload CLI evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cli-contract-evidence
          path: artifacts/ci/cli-contract/

  web-test:
    name: Web Test & Build (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install from lockfile
        run: |
          python scripts/verification/run_command_receipt.py \
            --name web_npm_ci \
            --cwd apps/web \
            --output artifacts/ci/web-test/receipts/npm_ci.json \
            --timeout 600 \
            -- npm ci

      # @windagent/app is a file:-dependency resolved at its REAL location
      # (../../frontend/app), so tsc resolves its imports through the frontend
      # workspace tree. That tree needs its own node_modules for the typecheck.
      - name: Install frontend workspace deps (source tree of the file:-dependency)
        run: |
          python scripts/verification/run_command_receipt.py \
            --name frontend_workspace_npm_ci \
            --cwd frontend \
            --output artifacts/ci/web-test/receipts/frontend_npm_ci.json \
            --timeout 600 \
            -- npm ci

      - name: Typecheck
        run: |
          python scripts/verification/run_command_receipt.py \
            --name web_typecheck \
            --cwd apps/web \
            --output artifacts/ci/web-test/receipts/typecheck.json \
            --timeout 300 \
            -- npm run typecheck

      - name: Unit tests and coverage
        run: |
          python scripts/verification/run_command_receipt.py \
            --name web_test_coverage \
            --cwd apps/web \
            --output artifacts/ci/web-test/receipts/test_coverage.json \
            --timeout 600 \
            -- npm run test:coverage

      - name: Build
        run: |
          python scripts/verification/run_command_receipt.py \
            --name web_build \
            --cwd apps/web \
            --output artifacts/ci/web-test/receipts/build.json \
            --timeout 600 \
            -- npm run build

      - name: Capture environment
        if: always()
        run: |
          python scripts/verification/capture_environment.py \
            --cwd apps/web \
            --output artifacts/ci/web-test/environment.json

      - name: Upload web evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-test-evidence
          path: artifacts/ci/web-test/

      - name: Upload web build
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: web-build
          path: apps/web/dist/

  web-test-windows:
    name: Web Test & Build (Windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install from lockfile
        run: |
          python scripts/verification/run_command_receipt.py `
            --name web_windows_npm_ci `
            --cwd apps/web `
            --output artifacts/ci/web-test-windows/receipts/npm_ci.json `
            --timeout 600 `
            -- npm.cmd ci

      # @windagent/app is a file:-dependency resolved at its REAL location
      # (../../frontend/app), so tsc resolves its imports through the frontend
      # workspace tree. That tree needs its own node_modules for the typecheck.
      - name: Install frontend workspace deps (source tree of the file:-dependency)
        run: |
          python scripts/verification/run_command_receipt.py `
            --name frontend_workspace_npm_ci `
            --cwd frontend `
            --output artifacts/ci/web-test-windows/receipts/frontend_npm_ci.json `
            --timeout 600 `
            -- npm.cmd ci

      - name: Typecheck
        run: |
          python scripts/verification/run_command_receipt.py `
            --name web_windows_typecheck `
            --cwd apps/web `
            --output artifacts/ci/web-test-windows/receipts/typecheck.json `
            --timeout 300 `
            -- npm.cmd run typecheck

      - name: Unit tests
        run: |
          python scripts/verification/run_command_receipt.py `
            --name web_windows_tests `
            --cwd apps/web `
            --output artifacts/ci/web-test-windows/receipts/tests.json `
            --timeout 600 `
            -- npm.cmd test

      - name: Build
        run: |
          python scripts/verification/run_command_receipt.py `
            --name web_windows_build `
            --cwd apps/web `
            --output artifacts/ci/web-test-windows/receipts/build.json `
            --timeout 600 `
            -- npm.cmd run build

      - name: Capture environment
        if: always()
        run: |
          python scripts/verification/capture_environment.py `
            --cwd apps/web `
            --output artifacts/ci/web-test-windows/environment.json

      - name: Upload Windows web evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-test-windows-evidence
          path: artifacts/ci/web-test-windows/

  desktop-test:
    name: Desktop Test & Build (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install from lockfile
        run: |
          python scripts/verification/run_command_receipt.py \
            --name desktop_npm_ci \
            --cwd apps/desktop \
            --output artifacts/ci/desktop-test/receipts/npm_ci.json \
            --timeout 600 \
            -- npm ci

      # @windagent/app is a file:-dependency resolved at its REAL location
      # (../../frontend/app), so tsc resolves its imports through the frontend
      # workspace tree. That tree needs its own node_modules for the typecheck.
      - name: Install frontend workspace deps (source tree of the file:-dependency)
        run: |
          python scripts/verification/run_command_receipt.py \
            --name frontend_workspace_npm_ci \
            --cwd frontend \
            --output artifacts/ci/desktop-test/receipts/frontend_npm_ci.json \
            --timeout 600 \
            -- npm ci

      - name: Typecheck
        run: |
          python scripts/verification/run_command_receipt.py \
            --name desktop_typecheck \
            --cwd apps/desktop \
            --output artifacts/ci/desktop-test/receipts/typecheck.json \
            --timeout 300 \
            -- npx tsc --noEmit

      - name: Unit tests
        run: |
          python scripts/verification/run_command_receipt.py \
            --name desktop_tests \
            --cwd apps/desktop \
            --output artifacts/ci/desktop-test/receipts/tests.json \
            --timeout 600 \
            -- npm test

      - name: Build
        run: |
          python scripts/verification/run_command_receipt.py \
            --name desktop_build \
            --cwd apps/desktop \
            --output artifacts/ci/desktop-test/receipts/build.json \
            --timeout 600 \
            -- npm run build

      - name: Capture environment
        if: always()
        run: |
          python scripts/verification/capture_environment.py \
            --cwd apps/desktop \
            --output artifacts/ci/desktop-test/environment.json

      - name: Upload desktop evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-test-evidence
          path: artifacts/ci/desktop-test/

      - name: Upload desktop build
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: desktop-build
          path: apps/desktop/dist/

  desktop-test-windows:
    name: Desktop Test & Build (Windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install from lockfile
        run: |
          python scripts/verification/run_command_receipt.py `
            --name desktop_windows_npm_ci `
            --cwd apps/desktop `
            --output artifacts/ci/desktop-test-windows/receipts/npm_ci.json `
            --timeout 600 `
            -- npm.cmd ci

      # @windagent/app is a file:-dependency resolved at its REAL location
      # (../../frontend/app), so tsc resolves its imports through the frontend
      # workspace tree. That tree needs its own node_modules for the typecheck.
      - name: Install frontend workspace deps (source tree of the file:-dependency)
        run: |
          python scripts/verification/run_command_receipt.py `
            --name frontend_workspace_npm_ci `
            --cwd frontend `
            --output artifacts/ci/desktop-test-windows/receipts/frontend_npm_ci.json `
            --timeout 600 `
            -- npm.cmd ci

      - name: Typecheck
        run: |
          python scripts/verification/run_command_receipt.py `
            --name desktop_windows_typecheck `
            --cwd apps/desktop `
            --output artifacts/ci/desktop-test-windows/receipts/typecheck.json `
            --timeout 300 `
            -- npx.cmd tsc --noEmit

      - name: Unit tests
        run: |
          python scripts/verification/run_command_receipt.py `
            --name desktop_windows_tests `
            --cwd apps/desktop `
            --output artifacts/ci/desktop-test-windows/receipts/tests.json `
            --timeout 600 `
            -- npm.cmd test

      - name: Build
        run: |
          python scripts/verification/run_command_receipt.py `
            --name desktop_windows_build `
            --cwd apps/desktop `
            --output artifacts/ci/desktop-test-windows/receipts/build.json `
            --timeout 600 `
            -- npm.cmd run build

      - name: Capture environment
        if: always()
        run: |
          python scripts/verification/capture_environment.py `
            --cwd apps/desktop `
            --output artifacts/ci/desktop-test-windows/environment.json

      - name: Upload Windows desktop evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-test-windows-evidence
          path: artifacts/ci/desktop-test-windows/

  live-record-client-gate:
    name: Live Record Client Gate (frontend/app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install frontend workspace from lockfile
        run: |
          python scripts/verification/run_command_receipt.py \
            --name live_record_client_npm_ci \
            --cwd frontend \
            --output artifacts/ci/live-record-client-gate/receipts/npm_ci.json \
            --timeout 600 \
            -- npm ci

      # The lockfile was generated on Windows, and npm keeps platform-optional
      # deps out of the lockfile when they do not match the generating OS
      # (npm/cli#4828). vitest's rolldown bundler therefore has no native
      # binding on this runner; install the matching one WITHOUT touching the
      # lockfile.
      - name: Install Linux rolldown native binding (missing from Windows-generated lockfile)
        working-directory: frontend
        run: |
          RD_VERSION=$(node -p "require('./node_modules/rolldown/package.json').version")
          echo "rolldown ${RD_VERSION}: installing @rolldown/binding-linux-x64-gnu"
          npm install --no-save --ignore-scripts "@rolldown/binding-linux-x64-gnu@${RD_VERSION}"

      - name: Typecheck app workspace
        run: |
          python scripts/verification/run_command_receipt.py \
            --name live_record_client_typecheck \
            --cwd frontend \
            --output artifacts/ci/live-record-client-gate/receipts/typecheck.json \
            --timeout 300 \
            -- npm run typecheck -w app

      - name: Live Record vitest suites (P0 contracts + director wire shapes)
        run: |
          python scripts/verification/run_command_receipt.py \
            --name live_record_client_tests \
            --cwd frontend \
            --output artifacts/ci/live-record-client-gate/receipts/tests.json \
            --timeout 600 \
            -- npm run test -w app

      - name: Capture environment
        if: always()
        run: |
          python scripts/verification/capture_environment.py \
            --cwd frontend \
            --output artifacts/ci/live-record-client-gate/environment.json

      - name: Upload live-record client evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-record-client-gate-evidence
          path: artifacts/ci/live-record-client-gate/

  live-record-native-gate:
    name: Live Record Native Gate (recording-engine crate)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

