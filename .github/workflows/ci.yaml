            --output artifacts/ci/python-integration-sqlite/receipts/pytest.json \
            --timeout 1200 \
            -- uv run pytest tests/integration -v --tb=short \
              --junitxml=artifacts/ci/python-integration-sqlite/test-results/pytest.xml

      - name: Capture environment
        if: always()
        run: |
          python scripts/verification/capture_environment.py \
            --cwd . \
            --output artifacts/ci/python-integration-sqlite/environment.json

      - name: Upload SQLite integration evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-integration-sqlite-evidence
          path: artifacts/ci/python-integration-sqlite/

  python-integration-postgres:
    name: Python Integration Tests (Ubuntu PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: windagent
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d windagent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      WINDAGENT_DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/windagent
      # ADR 0006 §5: writable temp dir for tests.
      TMPDIR: ${{ runner.temp }}
      TEMP: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Sync dependencies
        run: uv sync --all-packages

      - name: PostgreSQL dialect and schema preflight
        run: |
          python scripts/verification/run_command_receipt.py \
            --name postgres_preflight \
            --output artifacts/ci/python-integration-postgres/receipts/postgres_preflight.json \
            --timeout 180 \
            -- uv run python scripts/verification/database_preflight.py \
              --require-dialect postgresql \
              --initialize-schema \
              --output artifacts/ci/python-integration-postgres/database_preflight.json

      - name: PostgreSQL integration tests
        run: |
          python scripts/verification/run_command_receipt.py \
            --name integration_postgres \
            --output artifacts/ci/python-integration-postgres/receipts/pytest.json \
            --timeout 1200 \
            -- uv run pytest tests/integration -v --tb=short \
              --junitxml=artifacts/ci/python-integration-postgres/test-results/pytest.xml

      - name: Multi-replica fencing tests
        run: |
          python scripts/verification/run_command_receipt.py \
            --name postgres_fencing \
            --output artifacts/ci/python-integration-postgres/receipts/fencing.json \
            --timeout 600 \
            -- uv run pytest tests/integration tests/unit/worker \
              -k "fencing or replica or leader or lease" -v --tb=short

      - name: Capture environment
        if: always()
        run: |
          python scripts/verification/capture_environment.py \
            --cwd . \
            --output artifacts/ci/python-integration-postgres/environment.json

      - name: Upload PostgreSQL evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-integration-postgres-evidence
          path: artifacts/ci/python-integration-postgres/

  runtime-smoke:
    name: Runtime Smoke Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Sync dependencies
        run: uv sync --all-packages

      - name: Runtime imports and version smoke
        run: |
          python scripts/verification/run_command_receipt.py \
            --name runtime_version_smoke \
            --output artifacts/ci/runtime-smoke/receipts/runtime_version_smoke.json \
            --timeout 180 \
            -- uv run python scripts/verification/runtime_version_smoke.py \
              --output artifacts/ci/runtime-smoke/runtime_version_report.json

      - name: Capture environment
        if: always()
        run: |
          python scripts/verification/capture_environment.py \
            --cwd . \
            --output artifacts/ci/runtime-smoke/environment.json

      - name: Upload runtime evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-smoke-evidence
          path: artifacts/ci/runtime-smoke/

  cli-contract:
    name: CLI Contract Gate
    runs-on: ubuntu-latest
    env:
      WINDAGENT_DATABASE_URL: sqlite+aiosqlite:///windagent.db
      # ADR 0006 §5: writable temp dir for tests.
      TMPDIR: ${{ runner.temp }}
      TEMP: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Sync dependencies
        run: uv sync --all-packages

      - name: CLI live/offline/demo/failure contract tests
        run: |
          python scripts/verification/run_command_receipt.py \
            --name cli_contract \
            --output artifacts/ci/cli-contract/receipts/pytest.json \
            --timeout 600 \
            -- uv run pytest \
              tests/unit/cli/test_live_integration.py \
              tests/unit/cli/test_cli_commands.py \
              tests/unit/cli/test_phase26_convergence.py \
              -v --tb=short \
              --junitxml=artifacts/ci/cli-contract/test-results/pytest.xml

      - name: Capture environment
        if: always()
        run: |
          python scripts/verification/capture_environment.py \
            --cwd . \
            --output artifacts/ci/cli-contract/environment.json

      - name: Upload CLI evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cli-contract-evidence
          path: artifacts/ci/cli-contract/

  web-test:
    name: Web Test & Build (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install from lockfile
        run: |
          python scripts/verification/run_command_receipt.py \
            --name web_npm_ci \
            --cwd apps/web \
            --output artifacts/ci/web-test/receipts/npm_ci.json \
            --timeout 600 \
            -- npm ci

      - name: Typecheck
        run: |
          python scripts/verification/run_command_receipt.py \
            --name web_typecheck \
            --cwd apps/web \
            --output artifacts/ci/web-test/receipts/typecheck.json \
            --timeout 300 \
            -- npm run typecheck

      - name: Unit tests and coverage
        run: |
          python scripts/verification/run_command_receipt.py \
            --name web_test_coverage \
            --cwd apps/web \
            --output artifacts/ci/web-test/receipts/test_coverage.json \
            --timeout 600 \
            -- npm run test:coverage

      - name: Build
        run: |
          python scripts/verification/run_command_receipt.py \
            --name web_build \
            --cwd apps/web \
            --output artifacts/ci/web-test/receipts/build.json \
            --timeout 600 \
            -- npm run build

      - name: Capture environment
        if: always()
        run: |
          python scripts/verification/capture_environment.py \
            --cwd apps/web \
            --output artifacts/ci/web-test/environment.json

      - name: Upload web evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-test-evidence
          path: artifacts/ci/web-test/

      - name: Upload web build
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: web-build
          path: apps/web/dist/

  web-test-windows:
    name: Web Test & Build (Windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install from lockfile
        run: |
          python scripts/verification/run_command_receipt.py `
            --name web_windows_npm_ci `
            --cwd apps/web `
            --output artifacts/ci/web-test-windows/receipts/npm_ci.json `
            --timeout 600 `
            -- npm.cmd ci

      - name: Typecheck
        run: |
          python scripts/verification/run_command_receipt.py `
            --name web_windows_typecheck `
            --cwd apps/web `
            --output artifacts/ci/web-test-windows/receipts/typecheck.json `
            --timeout 300 `
            -- npm.cmd run typecheck

      - name: Unit tests
        run: |
          python scripts/verification/run_command_receipt.py `
            --name web_windows_tests `
            --cwd apps/web `
            --output artifacts/ci/web-test-windows/receipts/tests.json `
            --timeout 600 `
            -- npm.cmd test

      - name: Build
        run: |
          python scripts/verification/run_command_receipt.py `
            --name web_windows_build `
            --cwd apps/web `
            --output artifacts/ci/web-test-windows/receipts/build.json `
            --timeout 600 `
            -- npm.cmd run build

      - name: Capture environment
        if: always()
        run: |
          python scripts/verification/capture_environment.py `
            --cwd apps/web `
            --output artifacts/ci/web-test-windows/environment.json

      - name: Upload Windows web evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-test-windows-evidence
          path: artifacts/ci/web-test-windows/

  desktop-test:
    name: Desktop Test & Build (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-python@v5
        with:
