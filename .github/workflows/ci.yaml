        env:
          CI_JOB_RESULTS: >-
            {"artifact-protocol":"${{ needs.artifact-protocol.result }}","version-consistency":"${{ needs.version-consistency.result }}","architecture-boundaries":"${{ needs.architecture-boundaries.result }}","architecture-suite":"${{ needs.architecture-suite.result }}","lint":"${{ needs.lint.result }}","unit-pure":"${{ needs.unit-pure.result }}","component-sqlite":"${{ needs.component-sqlite.result }}","contracts":"${{ needs.contracts.result }}","integration-sqlite":"${{ needs.integration-sqlite.result }}","postgres-production-semantics":"${{ needs.postgres-production-semantics.result }}","verification-tier":"${{ needs.verification-tier.result }}","windows-portability":"${{ needs.windows-portability.result }}","e2e-multiprocess":"${{ needs.e2e-multiprocess.result }}","web-test":"${{ needs.web-test.result }}","web-test-windows":"${{ needs.web-test-windows.result }}","desktop-test":"${{ needs.desktop-test.result }}","desktop-test-windows":"${{ needs.desktop-test-windows.result }}","studio-roadmap-gates":"${{ needs.studio-roadmap-gates.result }}","p1-e2e-postgres":"${{ needs.p1-e2e-postgres.result }}","runtime-smoke":"${{ needs.runtime-smoke.result }}","cli-contract":"${{ needs.cli-contract.result }}","coverage-gate":"${{ needs.coverage-gate.result }}","live-record-client-gate":"${{ needs.live-record-client-gate.result }}","live-record-native-gate":"${{ needs.live-record-native-gate.result }}"}
        run: |
          uv run python scripts/verification/validate_ci_evidence.py \
            --download-root artifacts/ci/downloaded \
            --schema scripts/schemas/command_receipt_v1.schema.json \
            --sha "${{ github.sha }}" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --job-results-json "$CI_JOB_RESULTS" \
            --jobs \
              artifact-protocol \
              version-consistency \
              architecture-boundaries \
              architecture-suite \
              lint \
              unit-pure \
              component-sqlite \
              contracts \
              integration-sqlite \
              postgres-production-semantics \
              verification-tier \
              windows-portability \
              e2e-multiprocess \
              web-test \
              web-test-windows \
              desktop-test \
              desktop-test-windows \
              studio-roadmap-gates \
              p1-e2e-postgres \
              runtime-smoke \
              cli-contract \
              coverage-gate \
              live-record-client-gate \
              live-record-native-gate \
            --output artifacts/ci/final-evidence/ci_run_manifest.json

      - name: Capture final environment
        if: always()
        run: |
          python scripts/verification/capture_environment.py \
            --cwd . \
            --output artifacts/ci/final-evidence/environment.json

      - name: Upload final evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-evidence-bundle
          path: artifacts/ci/final-evidence/