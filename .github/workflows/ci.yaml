name: CI & Phase 7 Verification Matrix

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "hardening/**"
      - "refactor/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  UV_VERSION: "0.5.0"
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

defaults:
  run:
    shell: bash

jobs:
  artifact-protocol:
    name: Artifact Protocol Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Sync dependencies
        run: uv sync --all-packages

      - name: Generate immutable candidate evidence
        run: |
          uv run python scripts/verification/generate_phase7_evidence.py \
            --commands-file scripts/verification/command_registry.yaml \
            --output-dir artifacts/architecture_v2_production_hardening/phase_07 \
            --cwd . \
            --run-id "ci-${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Validate candidate evidence
        run: |
          BUNDLE="artifacts/architecture_v2_production_hardening/phase_07/runs/ci-${{ github.run_id }}-${{ github.run_attempt }}/evidence_bundle.json"
          uv run python scripts/verification/validate_evidence_bundle.py "$BUNDLE"
          uv run python scripts/validate_artifact_schema.py "$BUNDLE" \
            --verify-hashes \
            --fail-on-warning \
            --repo-root . \
            --candidate-sha "${{ github.sha }}"
          uv run python scripts/validate_artifact_schema.py \
            --directory artifacts/architecture_v2_production_hardening/phase_07 \
            --recursive \
            --verify-hashes \
            --fail-on-warning \
            --repo-root .

      - name: Verify negative fixtures fail
        run: |
          for fixture in tests/fixtures/artifacts/*.json; do
            if [ "$(basename "$fixture")" != "valid_artifact.json" ]; then
              if uv run python scripts/validate_artifact_schema.py "$fixture"; then
                echo "Negative fixture unexpectedly passed: $fixture"
                exit 1
              fi
            fi
          done

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Record Phase 6 negative-injection receipts
        run: |
          python scripts/verification/run_negative_injections.py \
            --root . \
            --output-dir artifacts/ci/artifact-protocol/negative-injections

      - name: Upload artifact protocol evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artifact-protocol-evidence
          if-no-files-found: warn
          path: |
            artifacts/architecture_v2_production_hardening/phase_07/runs/ci-${{ github.run_id }}-${{ github.run_attempt }}
            artifacts/architecture_v2_production_hardening/phase_07/quarantine/ci-${{ github.run_id }}-${{ github.run_attempt }}
            artifacts/architecture_v2_production_hardening/phase_07/latest.json
            artifacts/ci/artifact-protocol/negative-injections/

  version-consistency:
    name: Version Consistency Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Sync dependencies
        run: uv sync --all-packages

      - name: Run fail-closed version check
        run: |
          python scripts/verification/run_command_receipt.py \
            --name version_consistency \
            --output artifacts/ci/version-consistency/receipts/version_consistency.json \
            --timeout 120 \
            -- uv run python scripts/check_version_consistency.py \
              --root . \
              --report artifacts/ci/version-consistency/version_consistency_report.json

      - name: Capture environment
        if: always()
        run: |
          python scripts/verification/capture_environment.py \
            --cwd . \
            --output artifacts/ci/version-consistency/environment.json

      - name: Upload version evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: version-consistency-evidence
          path: artifacts/ci/version-consistency/

  architecture-boundaries:
    name: Architecture Boundaries Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Sync dependencies
        run: uv sync --all-packages

      - name: Architecture checks
        run: |
          python scripts/verification/run_command_receipt.py \
            --name architecture_boundaries \
            --output artifacts/ci/architecture-boundaries/receipts/architecture_boundaries.json \
            --timeout 180 \
            -- uv run python scripts/check_architecture_imports.py \
              --root . \
              --json \
              --report artifacts/ci/architecture-boundaries/dependency_boundary_report.json \
              --graph artifacts/ci/architecture-boundaries/import_graph.json

      - name: No-legacy check
        if: always()
        run: |
          python scripts/verification/run_command_receipt.py \
            --name no_legacy_orchestration \
            --output artifacts/ci/architecture-boundaries/receipts/no_legacy_orchestration.json \
            --timeout 120 \
            -- uv run python scripts/check_no_legacy_orchestration.py

      - name: Repair-scope Ruff check
        if: always()
        run: |
          python scripts/verification/run_command_receipt.py \
            --name ruff_check \
            --output artifacts/ci/architecture-boundaries/receipts/ruff_check.json \
            --timeout 180 \
            -- uv run ruff check \
              apps/cli/windagent_cli/main.py \
              apps/cli/windagent_cli/composition.py \
              tools/windagent_tools/builtin_registry.py \
              scripts/check_architecture_imports.py \
              scripts/check_version_consistency.py \
              scripts/validate_artifact_schema.py \
              scripts/verification \
              tests/unit/cli/test_live_integration.py \
              tests/unit/scripts/test_check_version_consistency.py \
              tests/unit/scripts/test_ci_workflow.py \
              tests/unit/verification/test_evidence_generation.py \
              tests/unit/verification/test_ci_evidence_validation.py

      - name: Capture environment
        if: always()
        run: |
          python scripts/verification/capture_environment.py \
            --cwd . \
            --output artifacts/ci/architecture-boundaries/environment.json

      - name: Upload architecture evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: architecture-boundaries-evidence
          path: artifacts/ci/architecture-boundaries/

  python-unit-sqlite:
    name: Python Unit Tests (Ubuntu SQLite)
    runs-on: ubuntu-latest
    env:
      WINDAGENT_DATABASE_URL: sqlite+aiosqlite:///windagent.db
      # ADR 0006 §5: writable temp dir for tests (no writes to source tree).
      TMPDIR: ${{ runner.temp }}
      TEMP: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Sync dependencies
        run: uv sync --all-packages

      - name: Architecture, unit and regression tests
        run: |
          python scripts/verification/run_command_receipt.py \
            --name python_unit_sqlite \
            --output artifacts/ci/python-unit-sqlite/receipts/pytest.json \
            --timeout 1200 \
            -- uv run pytest tests/architecture tests/unit tests/regression \
              -v --tb=short \
              --junitxml=artifacts/ci/python-unit-sqlite/test-results/pytest.xml

      - name: Capture environment
        if: always()
        run: |
          python scripts/verification/capture_environment.py \
            --cwd . \
            --output artifacts/ci/python-unit-sqlite/environment.json

      - name: Upload unit evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-unit-sqlite-evidence
          path: artifacts/ci/python-unit-sqlite/

  python-unit-windows:
    name: Python Unit Tests (Windows SQLite)
    runs-on: windows-latest
    env:
      WINDAGENT_DATABASE_URL: sqlite+aiosqlite:///windagent.db
      # ADR 0006 §5: writable temp dir for tests.
      TMPDIR: ${{ runner.temp }}
      TEMP: ${{ runner.temp }}
      TMP: ${{ runner.temp }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Sync dependencies
        run: uv sync --all-packages

      - name: Unit tests
        run: |
          python scripts/verification/run_command_receipt.py `
            --name python_unit_windows `
            --output artifacts/ci/python-unit-windows/receipts/pytest.json `
            --timeout 1200 `
            -- uv run pytest tests/unit -v --tb=short `
              --junitxml=artifacts/ci/python-unit-windows/test-results/pytest.xml

      - name: Capture environment
        if: always()
        run: |
          python scripts/verification/capture_environment.py `
            --cwd . `
            --output artifacts/ci/python-unit-windows/environment.json

      - name: Upload Windows unit evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-unit-windows-evidence
          path: artifacts/ci/python-unit-windows/

  python-integration-sqlite:
    name: Python Integration Tests (Ubuntu SQLite)
    runs-on: ubuntu-latest
    env:
      WINDAGENT_DATABASE_URL: sqlite+aiosqlite:///windagent.db
      # ADR 0006 §5: writable temp dir for tests.
      TMPDIR: ${{ runner.temp }}
      TEMP: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@v4

