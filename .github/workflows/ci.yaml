  p1-e2e-postgres:
    name: P1 E2E PostgreSQL Vertical Slice (P1 Production Readiness)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: windagent
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d windagent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      WINDAGENT_TEST_POSTGRES_URL: postgresql+asyncpg://test:test@localhost:5432/windagent
      WINDAGENT_DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/windagent
    steps:
      - uses: actions/checkout@v4

      # Job-level `env:` cannot use the runner context (it makes the whole
      # workflow file invalid); publish temp vars from the first step instead.
      - name: Configure writable temp dir
        run: |
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Sync dependencies
        run: uv sync --all-packages

      - name: Attest real PostgreSQL 16 backend (fail-closed)
        run: |
          python scripts/verification/run_command_receipt.py \
            --name postgres_backend_attestation \
            --output artifacts/ci/p1-e2e-postgres/receipts/postgres_backend.json \
            --timeout 120 \
            -- uv run python scripts/verification/check_postgres_backend.py \
              --output artifacts/ci/p1-e2e-postgres/postgres_backend.json

      - name: PostgreSQL P1 vertical slice must PASS (not skip)
        run: |
          python scripts/verification/run_command_receipt.py \
            --name p1_postgres_vertical \
            --output artifacts/ci/p1-e2e-postgres/receipts/p1_vertical.json \
            --timeout 600 \
            -- uv run pytest tests/contracts/test_p1_e2e_acceptance.py::TestPostgresVerticalSlice -vv --tb=short
          # The receipt wrapper captures the subprocess stdout and persists it
          # under receipts/logs/<name>.stdout.log — pipe the pytest output into
          # that file, not into a shell tee the wrapper never sees.
          PG_LOG=artifacts/ci/p1-e2e-postgres/receipts/logs/p1_postgres_vertical.stdout.log
          test -f "$PG_LOG" || { echo "receipt log missing: $PG_LOG"; exit 1; }
          # Fail if test was skipped
          if grep -q "skipped" "$PG_LOG"; then
            echo "PostgreSQL P1 vertical slice was skipped — WINDAGENT_TEST_POSTGRES_URL not set or DB unavailable"
            cat "$PG_LOG"
            exit 1
          fi
          if grep -q "FAILED" "$PG_LOG"; then
            echo "PostgreSQL P1 vertical slice failed"
            cat "$PG_LOG"
            exit 1
          fi
          if ! grep -Eq "[0-9]+ passed" "$PG_LOG"; then
            echo "PostgreSQL P1 vertical slice did not report PASSED"
            cat "$PG_LOG"
            exit 1
          fi

      - name: P1 additional PG gates (real asset, idempotency, atomicity, CAS)
        run: |
          python scripts/verification/run_command_receipt.py \
            --name p1_pg_additional \
            --output artifacts/ci/p1-e2e-postgres/receipts/p1_additional.json \
            --timeout 600 \
            -- uv run pytest tests/contracts/test_p1_real_asset_persistence.py tests/contracts/test_p1_pg_idempotency_atomicity_cas.py -v --tb=short

      - name: Full P1 E2E suite on PostgreSQL (isolated database)
        run: |
          # The vertical-slice step pinned immutable demo data (shot plan) into
          # the shared service database. The full suite re-runs that slice, so
          # it must start from a CLEAN database — isolation via a dedicated
          # database, NOT by weakening the tests.
          export PGURL="postgresql://test:test@localhost:5432/windagent"
          psql "$PGURL" -c "DROP DATABASE IF EXISTS windagent_full;" -c "CREATE DATABASE windagent_full;"
          export WINDAGENT_TEST_POSTGRES_URL="postgresql+asyncpg://test:test@localhost:5432/windagent_full"
          export WINDAGENT_DATABASE_URL="postgresql+asyncpg://test:test@localhost:5432/windagent_full"
          python scripts/verification/run_command_receipt.py \
            --name p1_e2e_full_postgres \
            --output artifacts/ci/p1-e2e-postgres/receipts/p1_full.json \
            --timeout 900 \
            -- uv run pytest tests/contracts/test_p1_e2e_acceptance.py -v --tb=short
          PG_LOG=artifacts/ci/p1-e2e-postgres/receipts/logs/p1_e2e_full_postgres.stdout.log
          test -f "$PG_LOG" || { echo "receipt log missing: $PG_LOG"; exit 1; }
          if grep -q "FAILED" "$PG_LOG"; then
            echo "P1 E2E on PostgreSQL had failures"
            cat "$PG_LOG"
            exit 1
          fi

      - name: Capture environment
        if: always()
        run: |
          python scripts/verification/capture_environment.py \
            --cwd . \
            --output artifacts/ci/p1-e2e-postgres/environment.json

      - name: Upload P1 PG evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-e2e-postgres-evidence
          path: artifacts/ci/p1-e2e-postgres/


