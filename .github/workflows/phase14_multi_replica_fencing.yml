name: Phase 14 Multi-Replica Fencing CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  multi-replica-fencing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: curl -sSfL https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: uv sync --frozen || uv sync

      - name: Run multi-replica fencing tests
        run: |
          uv run pytest tests/integration/ -k "fencing or replica or leader" -v
          uv run pytest tests/unit/worker/ -k "fencing or replica or lease" -v