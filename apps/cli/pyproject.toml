[project]
name = "windagent_cli"
version = "0.3.0"
description = "WindAgent CLI entrypoint (doctor, architecture check, workflow run)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0.0",
    "windagent-core",
    "windagent-orchestration",
    "windagent-intelligence",
    "windagent-providers",
    "windagent-tools",
    "windagent-workflows",
    "windagent-storage",
    "windagent-observability",
    "windagent-plugins",
    "windagent-skills",
]

[project.scripts]
windagent-social-report = "windagent_cli.social_report_cli:main"

[tool.uv.sources]
windagent-core = { workspace = true }
windagent-orchestration = { workspace = true }
windagent-intelligence = { workspace = true }
windagent-providers = { workspace = true }
windagent-tools = { workspace = true }
windagent-workflows = { workspace = true }
windagent-storage = { workspace = true }
windagent-observability = { workspace = true }
windagent-plugins = { workspace = true }
windagent-skills = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["windagent_cli"]
