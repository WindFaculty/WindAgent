[project]
name = "windagent_worker"
version = "0.3.0"
description = "Background worker process for asynchronous task execution - Architecture V3"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "windagent-core",
    "windagent-orchestration",
    "windagent-execution",
    "windagent-providers",
    "windagent-tools",
    "windagent-intelligence",
    "windagent-context",
    "windagent-memory",
    "windagent-workflows",
    "windagent-verification",
    "windagent-storage",
    "windagent-observability",
]

[tool.uv.sources]
windagent-core = { workspace = true }
windagent-orchestration = { workspace = true }
windagent-execution = { workspace = true }
windagent-providers = { workspace = true }
windagent-tools = { workspace = true }
windagent-intelligence = { workspace = true }
windagent-context = { workspace = true }
windagent-memory = { workspace = true }
windagent-workflows = { workspace = true }
windagent-verification = { workspace = true }
windagent-storage = { workspace = true }
windagent-observability = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["windagent_worker"]
