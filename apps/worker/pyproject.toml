[project]
name = "windagent-worker"
version = "0.1.0"
description = "WindAgent V2 job worker runtime (engine arrives in Phase 7)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "windagent",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/windagent_worker"]
