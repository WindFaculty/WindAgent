[project]
name = "windagent-api"
version = "0.1.0"
description = "WindAgent V2 FastAPI application (Phase 8 API foundation)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "windagent",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/windagent_api"]
