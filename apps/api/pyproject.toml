[project]
name = "windagent_api"
version = "0.3.0"
description = "FastAPI REST & WebSocket entrypoint for Architecture V2"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "windagent-core",
    "windagent-orchestration",
    "windagent-execution",
    "windagent-intelligence",
    "windagent-providers",
    "windagent-tools",
    "windagent-storage",
    "windagent-observability",
]

[tool.uv.sources]
windagent-core = { workspace = true }
windagent-orchestration = { workspace = true }
windagent-execution = { workspace = true }
windagent-intelligence = { workspace = true }
windagent-providers = { workspace = true }
windagent-tools = { workspace = true }
windagent-storage = { workspace = true }
windagent-observability = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["windagent_api"]
