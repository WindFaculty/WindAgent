[project]
name = "windagent_observability"
version = "0.3.0"
description = "Logging, tracing, metrics, audit trail, cost tracking"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "windagent-core",
    "windagent-storage",
]

[tool.uv.sources]
windagent-core = { workspace = true }
windagent-storage = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["windagent_observability"]
