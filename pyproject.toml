[project]
name = "windagent-workspace"
version = "0.3.0"
description = "WindAgent Modular Monolith Architecture V3 Root Workspace"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.26.0",
    "pillow>=12.3.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-xdist>=3.0.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.0",
    "ruff>=0.8.0",
]

[tool.uv.workspace]
members = [
    "apps/api",
    "apps/cli",
    "apps/worker",
    "core",
    "orchestration",
    "intelligence",
    "providers",
    "tools",
    "workflows",
    "verification",
    "context",
    "memory",
    "execution",
    "storage",
    "observability",
    "evals",
    "plugins",
    "skills",
]

[tool.uv.sources]
windagent-core = { workspace = true }
windagent-orchestration = { workspace = true }
windagent-execution = { workspace = true }
windagent-intelligence = { workspace = true }
windagent-providers = { workspace = true }
windagent-tools = { workspace = true }
windagent-workflows = { workspace = true }
windagent-verification = { workspace = true }
windagent-context = { workspace = true }
windagent-memory = { workspace = true }
windagent-plugins = { workspace = true }
windagent-skills = { workspace = true }
windagent-storage = { workspace = true }
windagent-observability = { workspace = true }
windagent-evals = { workspace = true }
windagent-api = { workspace = true }
windagent-cli = { workspace = true }
windagent-worker = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = [
    ".",
    "scripts",
    "scripts/verification",
    "apps/api",
    "apps/cli",
    "apps/worker",
    "apps/desktop",
    "core",
    "orchestration",
    "intelligence",
    "providers",
    "tools",
    "workflows",
    "verification",
    "context",
    "memory",
    "execution",
    "storage",
    "observability",
    "evals",
    "plugins",
    "skills",
]
markers = [
    "postgres: requires real PostgreSQL semantics (row locking, CAS, fencing, isolation)",
    "slow: intentionally expensive (multiprocess, long-running, large fixture)",
    "regression: fixed production defect (keep bug ID in test name)",
    "multiprocess: starts OS processes (uvicorn, worker, subprocess)",
    "windows_only: Windows-specific behavior",
    "network: controlled network boundary (httpx.MockTransport or loopback only)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.ruff]
exclude = ["third_party", ".agents", ".venv", "__pycache__", "artifacts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
# Per-file ignores for justified bootstrap and barrel re-exports (local, not global noqa)
# E402: sys.path bootstrap before workspace imports is intentional composition wiring
# F401/F811 in barrel __init__.py: intentional re-exports, keep until __all__ audit
[tool.ruff.lint.per-file-ignores]
"scripts/**/*.py" = ["E402"]
"tests/**/*.py" = ["E402"]
"core/windagent_core/domain/video_production/__init__.py" = ["F401", "F811"]
"core/windagent_core/domain/video_production/ids.py" = ["F401"]
"tools/windagent_tools/**/*.py" = ["E402"]
