[project]
name = "windagent-workspace"
version = "0.3.0"
description = "WindAgent Modular Monolith Architecture V2 Root Workspace"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pillow>=12.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.0",
]

[tool.uv.workspace]
members = [
    "apps/api",
    "apps/cli",
    "apps/worker",
    "core",
    "orchestration",
    "intelligence",
    "providers",
    "tools",
    "workflows",
    "verification",
    "context",
    "memory",
    "execution",
    "storage",
    "observability",
    "evals",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = [
    "apps/api",
    "apps/cli",
    "apps/worker",
    "apps/backend",
    "core",
    "orchestration",
    "intelligence",
    "providers",
    "tools",
    "workflows",
    "verification",
    "context",
    "memory",
    "execution",
    "storage",
    "observability",
    "evals",
]
