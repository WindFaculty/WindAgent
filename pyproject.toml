[project]
name = "windagent-workspace"
version = "0.3.0"
description = "WindAgent Modular Monolith Architecture V2 Root Workspace"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pillow>=12.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.0",
]

[tool.uv.workspace]
members = [
    "apps/api",
    "apps/cli",
    "apps/worker",
    "core",
    "orchestration",
    "intelligence",
    "providers",
    "tools",
    "workflows",
    "verification",
    "context",
    "memory",
    "execution",
    "storage",
    "observability",
    "evals",
    "plugins",
    "skills",
]

[tool.uv.sources]
windagent-core = { workspace = true }
windagent-orchestration = { workspace = true }
windagent-execution = { workspace = true }
windagent-intelligence = { workspace = true }
windagent-providers = { workspace = true }
windagent-tools = { workspace = true }
windagent-workflows = { workspace = true }
windagent-verification = { workspace = true }
windagent-context = { workspace = true }
windagent-memory = { workspace = true }
windagent-plugins = { workspace = true }
windagent-skills = { workspace = true }
windagent-storage = { workspace = true }
windagent-observability = { workspace = true }
windagent-evals = { workspace = true }
windagent-api = { workspace = true }
windagent-cli = { workspace = true }
windagent-worker = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = [
    ".",
    "apps/api",
    "apps/cli",
    "apps/worker",
    "core",
    "orchestration",
    "intelligence",
    "providers",
    "tools",
    "workflows",
    "verification",
    "context",
    "memory",
    "execution",
    "storage",
    "observability",
    "evals",
    "plugins",
    "skills",
]
