[project]
name = "windagent_orchestration"
version = "0.3.0"
description = "Task manager, workflow engine, state machine, scheduler, dispatcher, retry, recovery"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "windagent-core",
    "windagent-storage",
]

[tool.uv.sources]
windagent-core = { workspace = true }
windagent-storage = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["windagent_orchestration"]
