[project]
name = "windagent_intelligence"
version = "0.3.0"
description = "Task classifier, planner, context builder, model router, summarizer, reviewer, reporter"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "windagent-core",
    "windagent-providers",
    "windagent-context",
]

[tool.uv.sources]
windagent-core = { workspace = true }
windagent-providers = { workspace = true }
windagent-context = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["windagent_intelligence"]
