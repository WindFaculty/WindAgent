    action: REWRITE
    dependencies: [foundation.kernel, foundation.platform_contracts, foundation.events, foundation.jobs_worker, foundation.security]
    test_oracle: W3C propagation, log redaction, bounded metrics, and worker trace integration
    status: FROZEN
  - id: modules.identity
