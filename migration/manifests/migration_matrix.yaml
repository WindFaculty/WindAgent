schema_version: 1
kind: migration_matrix
source_baseline:
  repository: ../WindAgent
  commit: 01695ca48dddb7220efd60c212e52dac1d6a5f2d
  captured_on: 2026-09-01
  include_uncommitted_changes: false
matrix_rules:
  each_id_has_exactly_one_specialist_inventory: true
  legacy_imports_are_forbidden: true
  migration_begins_only_after_foundation_gate: true
capabilities:
  - id: foundation.kernel
    capability: Domain-neutral kernel primitives
    source: core/windagent_core
    target: backend/src/windagent/kernel
    owner: foundation
    action: REWRITE
    dependencies: []
    test_oracle: kernel unit and architecture gates
    status: FROZEN
  - id: foundation.platform_contracts
    capability: Domain-agnostic platform contracts
    source: core/windagent_core/contracts
    target: backend/src/windagent/platform
    owner: foundation
    action: REWRITE
    dependencies: [foundation.kernel]
    test_oracle: fake-adapter contract and architecture gates
    status: FROZEN
  - id: foundation.module_runtime
    capability: Module manifests and registration
    source: plugins, skills, workflows registry
    target: backend/src/windagent/platform/modules
    owner: foundation
    action: REWRITE
    dependencies: [foundation.platform_contracts]
    test_oracle: manifest validation and bootstrap integration
    status: FROZEN
  - id: foundation.jobs_worker
    capability: Durable jobs and worker runtime
    source: apps/worker, orchestration scheduler, storage queues and leases
    target: apps/worker and backend/src/windagent/platform/jobs
    owner: foundation
    action: REWRITE
    dependencies: [foundation.persistence, foundation.events]
    test_oracle: claim, lease, fencing, retry, timeout, cancellation, restart parity
    status: FROZEN
  - id: foundation.security
    capability: Policy, secret, authorization, and audit foundation
