[project]
name = "windagent_plugins"
version = "0.3.0"
description = "Plugin system for extensible functionality - loader, registry, lifecycle, security, manifest"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "windagent-core",
]

[tool.uv.sources]
windagent-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["windagent_plugins"]
