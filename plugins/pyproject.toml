[project]
name = "windagent-plugins"
version = "0.3.0"
description = "WindAgent Plugin System - Top-level Package"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "windagent-core>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["windagent_plugins"]
