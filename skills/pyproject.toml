[project]
name = "windagent_skills"
version = "0.3.0"
description = "Skills system for reusable capabilities - loader, registry, execution, versioning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "windagent-core",
    "windagent-providers",
    "windagent-tools",
]

[tool.uv.sources]
windagent-core = { workspace = true }
windagent-providers = { workspace = true }
windagent-tools = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["windagent_skills"]
