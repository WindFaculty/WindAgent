[project]
name = "windagent_evals"
version = "0.3.0"
description = "Evaluation benchmarks, model output scoring, regression suites"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "windagent-core",
]

[tool.uv.sources]
windagent-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["windagent_evals"]
