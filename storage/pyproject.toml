[project]
name = "windagent_storage"
version = "0.3.0"
description = "Database repositories, ORM mappings, migration adapters, persistent artifact storage"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.10",
    "cryptography>=42.0.0",
    "windagent-core",
    "windagent-providers",
]

[tool.uv.sources]
windagent-core = { workspace = true }
windagent-providers = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["windagent_storage"]
