[project]
name = "windagent_core"
version = "0.3.0"
description = "Core domain models, contracts, domain events, errors, config, security types"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7",
    "typing-extensions",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["windagent_core"]
