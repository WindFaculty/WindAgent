# Canonical Phase 2 command registry.
#
# Every required command is executed by generate_phase7_evidence.py. Optional
# commands may be documented here but are never part of the final verdict.
commands:
  version_check:
    description: Check version consistency across installed workspace packages
    required: true
    shell: process
    argv:
      - uv
      - run
      - python
      - scripts/check_version_consistency.py
      - --root
      - .
      - --report
      - artifacts/ci/phase7/version_consistency_report.json
    expected_exit_codes: [0]
    timeout: 120

  artifact_schema_validation:
    description: Exercise the canonical artifact validator on a valid fixture
    required: true
    shell: process
    argv:
      - uv
      - run
      - python
      - scripts/validate_artifact_schema.py
      - tests/fixtures/artifacts/valid_artifact.json
    expected_exit_codes: [0]
    timeout: 60

  architecture_scaffold_check:
    description: Verify the architecture scaffold
    required: true
    shell: process
    argv:
      - uv
      - run
      - python
      - scripts/scaffold_architecture_v2.py
      - --check
    expected_exit_codes: [0]
    timeout: 120

  architecture_imports_check:
    description: Verify architecture import boundaries
    required: true
    shell: process
    argv:
      - uv
      - run
      - python
      - scripts/check_architecture_imports.py
      - --root
      - .
      - --json
    expected_exit_codes: [0]
    timeout: 120

  pytest_unit:
    description: Run the complete unit suite
    required: true
    shell: process
    argv:
      - uv
      - run
      - pytest
      - tests/unit
      - -q
    expected_exit_codes: [0]
    timeout: 1200

  pytest_integration:
    description: Run the complete integration suite
    required: true
    shell: process
    argv:
      - uv
      - run
      - pytest
      - tests/integration
      - -q
    expected_exit_codes: [0]
    timeout: 600

  version_authority_tests:
    description: Verify the canonical product-version authority
    required: true
    shell: process
    argv:
      - uv
      - run
      - pytest
      - tests/architecture/canonical/test_phase7_version_authority.py
      - -q
    expected_exit_codes: [0]
    timeout: 120

  negative_fixtures_tests:
    description: Verify architecture negative fixtures remain fail-closed
    required: true
    shell: process
    argv:
      - uv
      - run
      - pytest
      - tests/architecture/test_phase04_negative_fixtures.py
      - -q
    expected_exit_codes: [0]
    timeout: 120
