commands:
  version_check:
    description: "Check version consistency across packages"
    command:
      - uv
      - run
      - python
      - scripts/check_version_consistency.py
    expected_exit_codes: [0]
    timeout: 60

  artifact_schema_validation:
    description: "Validate artifact schema"
    command:
      - uv
      - run
      - python
      - scripts/validate_artifact_schema.py
      - tests/fixtures/artifacts/valid_artifact.json
    expected_exit_codes: [0]
    timeout: 30

  architecture_scaffold_check:
    description: "Check architecture scaffold"
    command:
      - uv
      - run
      - python
      - scripts/scaffold_architecture_v2.py
      - --check
    expected_exit_codes: [0]
    timeout: 60

  architecture_imports_check:
    description: "Check architecture import boundaries"
    command:
      - uv
      - run
      - python
      - scripts/check_architecture_imports.py
    expected_exit_codes: [0]
    timeout: 60

  pytest_unit:
    description: "Run unit tests"
    command:
      - uv
      - run
      - pytest
      - tests/unit
      - -q
    expected_exit_codes: [0]
    timeout: 300

  pytest_integration:
    description: "Run integration tests"
    command:
      - uv
      - run
      - pytest
      - tests/integration
      - -q
    expected_exit_codes: [0]
    timeout: 300

  version_authority_tests:
    description: "Run Phase 7 version authority tests"
    command:
      - uv
      - run
      - pytest
      - tests/unit/core/test_phase7_version_authority.py
      - -v
    expected_exit_codes: [0]
    timeout: 60

  negative_fixtures_tests:
    description: "Run negative fixture tests"
    command:
      - uv
      - run
      - pytest
      - tests/architecture/test_phase04_negative_fixtures.py
      - -v
    expected_exit_codes: [0]
    timeout: 60