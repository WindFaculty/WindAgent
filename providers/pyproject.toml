[project]
name = "windagent_providers"
version = "2.0.0"
description = "Model provider integrations (OpenAI, Anthropic, Google, Ollama, etc.) - Architecture V2 Canonical"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "windagent-core",
]

[tool.uv.sources]
windagent-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["windagent_providers"]
